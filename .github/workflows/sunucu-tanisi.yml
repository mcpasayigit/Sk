name: Sunucu tanısı

# Verilen IP'deki sunucunun kim olduğunu ve verilen alan adı için ne yanıt verdiğini gösterir.
# Yalnızca okur; sonuç çalıştırmanın Annotations bölümünde listelenir.
# Kullanıcı adı yazılırsa cPanel'in geçici adresi (IP/~kullanici ve sunucu adı/~kullanici) de denenir:
# alan adı sunucuda tanınmasa bile hesabın public_html klasöründeki dosyalar böyle görülebilir.
on:
  workflow_dispatch:
    inputs:
      ip:
        description: Sunucu IP adresi
        required: true
      host:
        description: Alan adı
        required: false
        default: suleymankaynak.com
      kullanici:
        description: cPanel kullanıcı adı (geçici adres denemesi için, boş bırakılabilir)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IP: ${{ github.event.inputs.ip }}
      HOST: ${{ github.event.inputs.host || 'suleymankaynak.com' }}
      KULLANICI: ${{ github.event.inputs.kullanici }}
    steps:
      - name: Tanı
        run: |
          set +e
          [[ "$IP" =~ ^[0-9.]+$ ]] || { echo "Geçersiz IP"; exit 1; }
          [[ "$HOST" =~ ^[a-z0-9.-]+$ ]] || { echo "Geçersiz alan adı"; exit 1; }
          [[ -z "$KULLANICI" || "$KULLANICI" =~ ^[a-z0-9_]{1,16}$ ]] || { echo "Geçersiz kullanıcı adı"; exit 1; }
          command -v dig >/dev/null || sudo apt-get install -y -qq dnsutils >/dev/null
          ann() {
            local t="$1" m
            m="$(cat | tr -c '[:print:]\n\t' '.')"
            m="${m//'%'/'%25'}"; m="${m//$'\n'/'%0A'}"
            printf '::notice title=%s::%s\n' "$t" "$m"
          }
          # Başlıkların ilk satırları + gövdenin ilk baytları
          show() { { head -12 "$1"; echo "--- gövde ($(wc -c < "$2") bayt):"; head -c "${3:-300}" "$2"; } | ann "$4"; }

          SRV="$(dig +short -x "$IP" | head -1 | sed 's/\.$//')"
          echo "Ters DNS (PTR): $SRV" | ann "Ters DNS"

          for p in 80 443 2083 2087; do
            if timeout 4 bash -c "exec 3<>/dev/tcp/$IP/$p" 2>/dev/null; then echo -n "$p açık; "; else echo -n "$p kapalı; "; fi
          done | ann "Portlar"

          # 1) Alan adıyla HTTP; 2) aynısı X-Forwarded-Proto ile; 3) Host'suz (sunucunun varsayılan sitesi)
          curl -s -m 20 -D /tmp/h1 -o /tmp/b1 -H "Host: $HOST" "http://$IP/"
          show /tmp/h1 /tmp/b1 300 "1) http://$HOST/ (IP'ye)"
          curl -s -m 20 -D /tmp/h2 -o /tmp/b2 -H "Host: $HOST" -H "X-Forwarded-Proto: https" "http://$IP/"
          show /tmp/h2 /tmp/b2 300 "2) aynısı + X-Forwarded-Proto: https"
          curl -s -m 20 -D /tmp/h3 -o /tmp/b3 "http://$IP/"
          show /tmp/h3 /tmp/b3 300 "3) http://IP/ (Host'suz = varsayılan site)"
          if cmp -s /tmp/b2 /tmp/b3; then
            echo "AYNI: alan adıyla istenince de varsayılan site cevap veriyor, yani bu IP'de $HOST için bir site tanımı yok (ya da başka IP'de)." | ann "Karşılaştırma 2-3"
          else
            echo "FARKLI: $HOST için sunucuda ayrı bir site tanımı var." | ann "Karşılaştırma 2-3"
          fi

          for path in /about-me/ /404.html /robots.txt /sitemap.xml; do
            curl -s -m 20 -o /dev/null -w '%{http_code} %{size_download} bayt %{content_type}\n' \
              -H "Host: $HOST" -H "X-Forwarded-Proto: https" "http://$IP$path"
          done | ann "Örnek adresler (http + X-Forwarded-Proto)"

          if [ -n "$KULLANICI" ]; then
            curl -s -m 20 -D /tmp/h4 -o /tmp/b4 -H "X-Forwarded-Proto: https" "http://$IP/~$KULLANICI/"
            show /tmp/h4 /tmp/b4 300 "4) http://IP/~$KULLANICI/"
            if [ -n "$SRV" ]; then
              curl -s -m 20 -D /tmp/h5 -o /tmp/b5 "https://$SRV/~$KULLANICI/"
              show /tmp/h5 /tmp/b5 300 "5) https://$SRV/~$KULLANICI/"
              for path in about-me/ 404.html; do
                curl -s -m 20 -o /dev/null -w '%{http_code} %{size_download} bayt %{content_type}\n' "https://$SRV/~$KULLANICI/$path"
              done | ann "Örnek adresler (https://$SRV/~$KULLANICI/...)"
            fi
          fi
